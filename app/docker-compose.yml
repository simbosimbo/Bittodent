# Prototipe, DATA PALSU SAJA (D-030). Belum diuji: Docker tidak terpasang di box dev.
# Kata sandi di bawah hanya placeholder dev; ganti lewat variabel lingkungan / file .env di samping file ini.
name: ehr-gigi

x-backend-env: &backend-env
  env_file: backend/.env           # APP_KEY, ENCRYPTION_KEY, BLIND_INDEX_KEY, dll. (salin dari .env.example)
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ehr_dev
    DB_USERNAME: ehr_app
    DB_PASSWORD: ${EHR_APP_PASSWORD:-ehr_app_dev}
    DB_ADMIN_USERNAME: ehr_admin
    DB_ADMIN_PASSWORD: ${EHR_ADMIN_PASSWORD:-ehr_admin_dev}
    DB_APP_GRANT_HOST: "%"          # di jaringan Docker ehr_app datang dari IP container, bukan 127.0.0.1
    APP_URL: http://127.0.0.1:8080
    SANCTUM_STATEFUL_DOMAINS: 127.0.0.1:8080,localhost:8080
    FRONTEND_ORIGINS: http://127.0.0.1:8080,http://localhost:8080

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --log-bin-trust-function-creators=1   # trigger append-only dibuat oleh ehr_admin (bukan SUPER)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
      EHR_ADMIN_PASSWORD: ${EHR_ADMIN_PASSWORD:-ehr_admin_dev}
      EHR_APP_PASSWORD: ${EHR_APP_PASSWORD:-ehr_app_dev}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3307:3306"       # 3307 agar tidak bentrok dengan MySQL lokal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    build: ./backend
    <<: *backend-env
    command: ["php", "artisan", "migrate", "--database=mysql_admin", "--force"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    <<: *backend-env
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]   # hanya terjangkau di jaringan compose
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
