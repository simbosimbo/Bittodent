; Staging-like. Tidak menampilkan error ke browser; log ke stderr container.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
