# Satu origin untuk SPA + API agar cookie sesi Sanctum dan XSRF-TOKEN tetap first-party (sama dengan proxy Vite).
# Laravel dijalankan php-fpm di service "backend" (FastCGI :9000). TLS TIDAK diakhiri di sini, jadi tanpa HSTS;
# jika ada terminator TLS di depan, set TRUSTED_PROXIES (IP-nya) di env backend agar Laravel melihat https.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # Header keamanan dipasang per location statis di bawah (add_header tidak diwarisi bila location punya add_header).
    # Respons Laravel (FastCGI) memasang header sendiri lewat middleware SecurityHeaders, jadi tidak digandakan di sini.

    location ~ ^/(api|login|logout|two-factor-challenge|sanctum|user|up|ready)(/|$) {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
