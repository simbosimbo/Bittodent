<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="title" class="tooth-svg" color="#1F2937" >
  <title id="title">Status tindakan odontogram (kemungkinan MVP)</title>
  <style>
/* Bitto odontogram — classes the React build should toggle */
.tooth-svg { color: #1F2937; font-family: Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif; }
.tooth-surface {
  fill: #FFFFFF;
  stroke: none;
  pointer-events: auto;
  cursor: pointer;
}
.tooth-outline, .tooth-divisions {
  fill: none;
  stroke: currentColor;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}
.tooth-outline { stroke-width: 1.75; }
.tooth-divisions { stroke-width: 1.15; }
.tooth-number {
  fill: #1F2937;
  font-family: Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-anchor: middle;
  pointer-events: none;
}
.tooth[data-state="draft"] .tooth-outline {
  stroke: #6D28D9;
  stroke-width: 2.1;
  stroke-dasharray: 3.5 2.5;
}
.tooth[data-state="draft"] .tooth-divisions { stroke: #6D28D9; }
.tooth[data-state="draft"] .tooth-wash { fill: #F3EEFF; }
.tooth[data-state="signed"] .tooth-outline {
  stroke: #111827;
  stroke-width: 2;
  stroke-dasharray: none;
}
.tooth-lock { fill: #111827; stroke: none; }
.tooth-draft-mark { fill: #A15C00; stroke: none; }

.tooth-surface[data-condition="sehat"] { fill: #E8F6EE; }
.tooth-surface[data-condition="karies"] { fill: #BE123C; }
.tooth-surface[data-condition="tambalan"] { fill: #1E40AF; }

.surface-dots { fill: #FFFFFF; pointer-events: none; }
.overlay { pointer-events: none; }
.overlay-mahkota {
  fill: none;
  stroke: #6D28D9;
  stroke-width: 3;
}
.overlay-hilang {
  fill: none;
  stroke: #3F3F46;
  stroke-width: 3.2;
  stroke-linecap: square;
}
.overlay-sisa-akar {
  fill: none;
  stroke: #9A3412;
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.overlay-perlu-dicabut {
  fill: none;
  stroke: #A15C00;
  stroke-width: 3.2;
  stroke-linecap: square;
}
.overlay-implan {
  fill: none;
  stroke: #0F5F63;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Procedure status — independent of condition colour+shape.
   Kemungkinan MVP, menunggu persetujuan Jerome. */
.tooth-surface[data-status] { fill-opacity: 1; }
.tooth-surface[data-status="sudah_ada_lain"] { fill-opacity: 0.7; }
.tooth-surface[data-status="direncanakan"] { fill-opacity: 0.5; }
.tooth-surface[data-status="dirujuk"] { fill-opacity: 0.8; }
.tooth[data-status="direncanakan"] .tooth-outline {
  stroke-dasharray: 4 2.5;
}
.tooth[data-status="dirujuk"] .tooth-outline {
  stroke-dasharray: 1.5 2;
}
.tooth[data-baseline="missing"] { opacity: 0.45; }
.tooth[data-baseline="missing"] .tooth-surface { fill: #E5E7EB; }
.status-mark { pointer-events: none; }

/* Soft 3D graphical chart */
.tooth-3d { cursor: pointer; }
.tooth-3d .tooth-hit { fill: transparent; stroke: none; pointer-events: all; }
.tooth-3d .anatomy, .tooth-3d .cond-mark { pointer-events: none; }
.tooth-3d[data-state="draft"] .tooth-3d-frame {
  fill: none;
  stroke: #6D28D9;
  stroke-width: 2.2;
  stroke-dasharray: 4 3;
}
.tooth-3d[data-state="signed"] .tooth-3d-frame {
  fill: none;
  stroke: #111827;
  stroke-width: 1.8;
}
.tooth-3d[data-baseline="missing"] { opacity: 0.4; }
  .sheet-title { font-weight: 700; font-size: 20px; fill: #111827; }
  .sheet-sub { font-size: 11px; fill: #4B5563; }
  .sheet-cap { font-size: 11px; fill: #1F2937; font-weight: 600; text-anchor: middle; }
  .sheet-hint { font-size: 10px; fill: #6B7280; text-anchor: middle; }
  </style>
