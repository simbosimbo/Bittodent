<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 160" width="100" height="160" role="img" aria-labelledby="title" class="tooth-svg" color="#1F2937" >
  <title id="title">Gigi FDI 85 (grafis 3D, molar, primary, lower, 2 akar)</title>
  <desc>Bagan grafis 3D lembut. Ketuk untuk memilih gigi 85, bukan per permukaan. Sasaran ketuk per permukaan ada di bagan 2D.</desc>
  <style>
/* Bitto odontogram — classes the React build should toggle */
.tooth-svg { color: #1F2937; font-family: Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif; }
.tooth-surface {
  fill: #FFFFFF;
  stroke: none;
  pointer-events: auto;
  cursor: pointer;
}
.tooth-outline, .tooth-divisions {
  fill: none;
  stroke: currentColor;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}
.tooth-outline { stroke-width: 1.75; }
.tooth-divisions { stroke-width: 1.15; }
.tooth-number {
  fill: #1F2937;
  font-family: Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-anchor: middle;
  pointer-events: none;
}
.tooth[data-state="draft"] .tooth-outline {
  stroke: #6D28D9;
  stroke-width: 2.1;
  stroke-dasharray: 3.5 2.5;
}
.tooth[data-state="draft"] .tooth-divisions { stroke: #6D28D9; }
.tooth[data-state="draft"] .tooth-wash { fill: #F3EEFF; }
.tooth[data-state="signed"] .tooth-outline {
  stroke: #111827;
  stroke-width: 2;
  stroke-dasharray: none;
}
.tooth-lock { fill: #111827; stroke: none; }
.tooth-draft-mark { fill: #A15C00; stroke: none; }

.tooth-surface[data-condition="sehat"] { fill: #E8F6EE; }
.tooth-surface[data-condition="karies"] { fill: #BE123C; }
.tooth-surface[data-condition="tambalan"] { fill: #1E40AF; }

.surface-dots { fill: #FFFFFF; pointer-events: none; }
.overlay { pointer-events: none; }
.overlay-mahkota {
  fill: none;
  stroke: #6D28D9;
  stroke-width: 3;
}
.overlay-hilang {
  fill: none;
  stroke: #3F3F46;
  stroke-width: 3.2;
  stroke-linecap: square;
}
.overlay-sisa-akar {
  fill: none;
  stroke: #9A3412;
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.overlay-perlu-dicabut {
  fill: none;
  stroke: #A15C00;
  stroke-width: 3.2;
  stroke-linecap: square;
}
.overlay-implan {
  fill: none;
  stroke: #0F5F63;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Procedure status — independent of condition colour+shape.
   Kemungkinan MVP, menunggu persetujuan Jerome. */
.tooth-surface[data-status] { fill-opacity: 1; }
.tooth-surface[data-status="sudah_ada_lain"] { fill-opacity: 0.7; }
.tooth-surface[data-status="direncanakan"] { fill-opacity: 0.5; }
.tooth-surface[data-status="dirujuk"] { fill-opacity: 0.8; }
.tooth[data-status="direncanakan"] .tooth-outline {
  stroke-dasharray: 4 2.5;
}
.tooth[data-status="dirujuk"] .tooth-outline {
  stroke-dasharray: 1.5 2;
}
.tooth[data-baseline="missing"] { opacity: 0.45; }
.tooth[data-baseline="missing"] .tooth-surface { fill: #E5E7EB; }
.status-mark { pointer-events: none; }

/* Soft 3D graphical chart */
.tooth-3d { cursor: pointer; }
.tooth-3d .tooth-hit { fill: transparent; stroke: none; pointer-events: all; }
.tooth-3d .anatomy, .tooth-3d .cond-mark { pointer-events: none; }
.tooth-3d[data-state="draft"] .tooth-3d-frame {
  fill: none;
  stroke: #6D28D9;
  stroke-width: 2.2;
  stroke-dasharray: 4 3;
}
.tooth-3d[data-state="signed"] .tooth-3d-frame {
  fill: none;
  stroke: #111827;
  stroke-width: 1.8;
}
.tooth-3d[data-baseline="missing"] { opacity: 0.4; }
  </style>
  <defs>
    <linearGradient id="enamel" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="0.45" stop-color="#F0E2CC"/>
      <stop offset="1" stop-color="#D2BB9A"/>
    </linearGradient>
    <linearGradient id="enamel-occlusal" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E6D3B6"/>
      <stop offset="1" stop-color="#C4AB88"/>
    </linearGradient>
    <linearGradient id="root-grad" x1="0.3" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#EAD4B4"/>
      <stop offset="1" stop-color="#D0B087"/>
    </linearGradient>
    <linearGradient id="root-back" x1="0.3" y1="1" x2="0.7" y2="0">
      <stop offset="0" stop-color="#E0C49A"/>
      <stop offset="1" stop-color="#C4A078"/>
    </linearGradient>
    <radialGradient id="soft-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A7A68" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8A7A68" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#DDD6FE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="implant-grad" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#0F5F63"/>
    </linearGradient>
    <linearGradient id="prosthetic" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#F5F0E8"/>
      <stop offset="1" stop-color="#C8B8A0"/>
    </linearGradient>
  </defs>
  <g id="t85" class="tooth tooth-3d tooth--molar tooth--primary" data-tooth="85" data-type="molar" data-dentition="primary" data-arch="lower" data-quadrant="8" data-roots="2" data-state="empty"><g class="anatomy" transform="translate(0,160) scale(1,-1)"><ellipse cx="52" cy="125.8" rx="26" ry="7" fill="url(#soft-shadow)"/><path d="M31.4,71.4 C34,51.4 35.9,31.5 37,31.4 C38.1,31.4 42,51 46.6,70.6 Z" fill="url(#root-grad)" stroke="#6F5E4A" stroke-width="1.05" stroke-linejoin="round"/><path d="M53.4,70.6 C58,51 61.9,31.4 63,31.4 C64.1,31.5 66,51.4 68.6,71.4 Z" fill="url(#root-grad)" stroke="#6F5E4A" stroke-width="1.05" stroke-linejoin="round"/><ellipse cx="50" cy="70" rx="22" ry="5.5" fill="url(#enamel)" stroke="#6F5E4A" stroke-width="0.8"/><path d="M29,70 C27,78 25,94.9 25,98.9 C25,111.8 28,116.8 33,121.8 L67,121.8 C72,116.8 75,111.8 75,98.9 C75,94.9 73,78 71,70 Z" fill="url(#enamel)" fill-opacity="1" stroke="#6F5E4A" stroke-width="1.15" stroke-linejoin="round"/><path d="M35.5,110.8 L64.5,110.8 Q68,110.8 68,114.3 L68,116.3 Q68,119.8 64.5,119.8 L35.5,119.8 Q32,119.8 32,116.3 L32,114.3 Q32,110.8 35.5,110.8 Z" fill="url(#enamel-occlusal)" fill-opacity="1" stroke="#6F5E4A" stroke-width="0.85"/><path d="M31,78 C38,80 39,90.5 34,98.5 C32,88.5 30,88 31,78 Z" fill="#FFFFFF" fill-opacity="0.42"/></g><text class="tooth-number" x="50" y="12" font-size="11">85</text><rect class="tooth-hit" x="8" y="6" width="84" height="148" rx="12"><title>Pilih gigi 85</title></rect></g>
</svg>
