<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 122" width="100" height="122" role="img" aria-labelledby="title" class="tooth-svg" color="#1F2937" >
  <title id="title">Kerangka canine primary (orientasi kuadran 5)</title>
  <desc>Templat tipe. Permukaan memakai id type-canine-primary-{huruf}. Orientasi: B atas, L bawah, D kiri, M kanan (kanan atas pasien).</desc>
  <style>
/* Bitto odontogram — classes the React build should toggle */
.tooth-svg { color: #1F2937; font-family: Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif; }
.tooth-surface {
  fill: #FFFFFF;
  stroke: none;
  pointer-events: auto;
  cursor: pointer;
}
.tooth-outline, .tooth-divisions {
  fill: none;
  stroke: currentColor;
  stroke-linejoin: round;
  stroke-linecap: round;
  pointer-events: none;
}
.tooth-outline { stroke-width: 1.75; }
.tooth-divisions { stroke-width: 1.15; }
.tooth-number {
  fill: #1F2937;
  font-family: Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-anchor: middle;
  pointer-events: none;
}
.tooth[data-state="draft"] .tooth-outline {
  stroke: #6D28D9;
  stroke-width: 2.1;
  stroke-dasharray: 3.5 2.5;
}
.tooth[data-state="draft"] .tooth-divisions { stroke: #6D28D9; }
.tooth[data-state="draft"] .tooth-wash { fill: #F3EEFF; }
.tooth[data-state="signed"] .tooth-outline {
  stroke: #111827;
  stroke-width: 2;
  stroke-dasharray: none;
}
.tooth-lock { fill: #111827; stroke: none; }
.tooth-draft-mark { fill: #A15C00; stroke: none; }

.tooth-surface[data-condition="sehat"] { fill: #E8F6EE; }
.tooth-surface[data-condition="karies"] { fill: #BE123C; }
.tooth-surface[data-condition="tambalan"] { fill: #1E40AF; }

.surface-dots { fill: #FFFFFF; pointer-events: none; }
.overlay { pointer-events: none; }
.overlay-mahkota {
  fill: none;
  stroke: #6D28D9;
  stroke-width: 3;
}
.overlay-hilang {
  fill: none;
  stroke: #3F3F46;
  stroke-width: 3.2;
  stroke-linecap: square;
}
.overlay-sisa-akar {
  fill: none;
  stroke: #9A3412;
  stroke-width: 2.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.overlay-perlu-dicabut {
  fill: none;
  stroke: #A15C00;
  stroke-width: 3.2;
  stroke-linecap: square;
}
.overlay-implan {
  fill: none;
  stroke: #0F5F63;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Procedure status — independent of condition colour+shape.
   Kemungkinan MVP, menunggu persetujuan Jerome. */
.tooth-surface[data-status] { fill-opacity: 1; }
.tooth-surface[data-status="sudah_ada_lain"] { fill-opacity: 0.7; }
.tooth-surface[data-status="direncanakan"] { fill-opacity: 0.5; }
.tooth-surface[data-status="dirujuk"] { fill-opacity: 0.8; }
.tooth[data-status="direncanakan"] .tooth-outline {
  stroke-dasharray: 4 2.5;
}
.tooth[data-status="dirujuk"] .tooth-outline {
  stroke-dasharray: 1.5 2;
}
.tooth[data-baseline="missing"] { opacity: 0.45; }
.tooth[data-baseline="missing"] .tooth-surface { fill: #E5E7EB; }
.status-mark { pointer-events: none; }

/* Soft 3D graphical chart */
.tooth-3d { cursor: pointer; }
.tooth-3d .tooth-hit { fill: transparent; stroke: none; pointer-events: all; }
.tooth-3d .anatomy, .tooth-3d .cond-mark { pointer-events: none; }
.tooth-3d[data-state="draft"] .tooth-3d-frame {
  fill: none;
  stroke: #6D28D9;
  stroke-width: 2.2;
  stroke-dasharray: 4 3;
}
.tooth-3d[data-state="signed"] .tooth-3d-frame {
  fill: none;
  stroke: #111827;
  stroke-width: 1.8;
}
.tooth-3d[data-baseline="missing"] { opacity: 0.4; }
  </style>
  <g id="type-canine-primary" class="tooth tooth--canine tooth--primary" data-type="canine" data-dentition="primary" data-state="empty">
    <path id="type-canine-primary-M" class="tooth-surface" data-surface="M" d="M84,15 L84,85 L50,56 L64,50 L50,44 Z"/>
    <path id="type-canine-primary-D" class="tooth-surface" data-surface="D" d="M16,85 L16,15 L50,44 L36,50 L50,56 Z"/>
    <path id="type-canine-primary-I" class="tooth-surface" data-surface="I" d="M50,44 L64,50 L50,56 L36,50 Z"/>
    <path id="type-canine-primary-B" class="tooth-surface" data-surface="B" d="M23,8 L77,8 Q84,8 84,15 L64,50 L50,44 L36,50 L16,15 Q16,8 23,8 Z"/>
    <path id="type-canine-primary-L" class="tooth-surface" data-surface="L" d="M77,92 L23,92 Q16,92 16,85 L36,50 L50,56 L64,50 L84,85 Q84,92 77,92 Z"/>
    <g class="tooth-lines" pointer-events="none">
      <path class="tooth-divisions" d="M50,44 L64,50 L50,56 L36,50 Z M50,44 L50,8 M64,50 L84,50 M50,56 L50,92 M36,50 L16,50"/>
      <path class="tooth-outline" d="M23,8 L77,8 Q84,8 84,15 L84,85 Q84,92 77,92 L23,92 Q16,92 16,85 L16,15 Q16,8 23,8 Z"/>
    </g>
    <text class="tooth-number" x="50" y="116" font-size="11">canine · sulung</text>
  </g>
</svg>
