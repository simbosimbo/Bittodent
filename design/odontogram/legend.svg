  <text class="lg-badge" x="224" y="34" font-family="Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif">BUKAN standar resmi Kemenkes/PDGI</text>
  <text class="lg-disc" x="32" y="58" font-family="Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif">Warna + bentuk (bukan warna saja). Komponen ini bisa diganti saat formulir resmi tersedia. Kontras non-teks ≥ 3:1 terhadap putih (WCAG 2.2).</text>
