  <text class="lg-disc" x="32" y="428" font-family="Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif">Berlaku per permukaan: sehat, karies, tambalan. Berlaku pada seluruh gigi: mahkota, hilang, sisa akar, perlu dicabut, implan.</text>
  <text class="lg-disc" x="32" y="446" font-family="Inter, IBM Plex Sans, Liberation Sans, system-ui, sans-serif">React: data-condition pada .tooth-surface (sehat, karies, tambalan) atau pada grup .tooth (mahkota, hilang, sisa akar, perlu dicabut, implan).</text>
